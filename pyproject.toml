[project]
name = "cm-mcp-contracts"
version = "0.1.0"
description = "Tool contracts for the code-mode MCP platform: the rulebook, templates, approved contracts, and the governance gate"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No importable package: this repo ships JSON and the scripts that police it.
only-include = ["schema", "templates", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "node_modules", "frontend", "dist"]

[tool.ruff.lint]
# F: unused imports and names. ERA: commented-out code. B/SIM/RET/C4/UP: the
# small stuff that accumulates. Deliberately not the whole catalogue -- a lint
# nobody can keep green stops being read.
select = ["F", "E", "W", "I", "B", "SIM", "RET", "C4", "UP", "ERA", "ARG"]
ignore = ["E501"]  # line length is reported by the formatter, not worth failing on

[tool.ruff.lint.per-file-ignores]
# A pytest fixture is "used" by being requested, which ARG cannot see.
"tests/**" = ["ARG001", "ARG002"]
