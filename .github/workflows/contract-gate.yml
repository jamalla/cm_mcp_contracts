# PR gate. Nothing reaches the registry without passing both jobs.
name: contract-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structural:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The evolution check compares each contract against the approved one
          # on main. A shallow checkout has no main to compare against, and the
          # check would pass by finding nothing rather than by finding nothing wrong.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        # Unused code, commented-out code, and the small decay that accumulates.
        # Cheap to keep green now; expensive to reintroduce later.
        run: uvx ruff check .

      - name: Validate every approved contract against the meta-schema
        # The whole set, not just the diff: tightening the schema must not leave
        # an older contract silently non-conforming.
        run: uv run python scripts/validate_contracts.py

      - name: Confirm the rejection fixtures are still rejected
        # Guards the gate itself. If a schema edit accidentally makes these
        # valid, the gate has stopped gating.
        run: uv run python scripts/validate_contracts.py --dir tests/fixtures/invalid --expect-invalid

      - name: Changed contracts must say so in their version
        # The only check that knows what a contract USED to be. Everything else
        # asks whether it is well formed now, which an argument quietly deleted
        # from an approved tool passes without trouble.
        run: uv run python scripts/check_evolution.py --baseline origin/${{ github.base_ref || 'main' }}

      - name: Unit tests
        run: uv run --extra dev pytest -q

  semantic:
    name: Semantic review (LLM-as-judge)
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Review contract quality
        # Falls back to deterministic heuristics when the secret is absent,
        # which is what happens on fork PRs. The check still means something
        # there rather than silently passing.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python scripts/eval_contracts.py

  buildable:
    name: Registry builds
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the registry artifact
        # Catches duplicate tool names and anything else that would break
        # publishing, on the PR rather than after merge.
        run: uv run python scripts/build_registry.py

      - uses: actions/upload-artifact@v4
        with:
          name: registry-preview
          path: dist/registry/
